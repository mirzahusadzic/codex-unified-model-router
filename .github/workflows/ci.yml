name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        run: |
          for file in router/*.mjs scripts/*.mjs tests/*.mjs; do
            node --check "$file"
          done
      - name: Run regression tests
        run: node --test
      - name: Validate catalog and prompts
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          const normalize = value => value.replace(/\r\n/g, '\n');
          const instructions = normalize(readFileSync('prompts/openrouter-instructions.md', 'utf8'));
          const persistent = normalize(readFileSync('prompts/openrouter-persistent.md', 'utf8'));
          let openrouterEntries = 0;
          for (const file of readdirSync('catalog').filter(name => name.endsWith('.json'))) {
            const value = JSON.parse(readFileSync(`catalog/${file}`, 'utf8'));
            for (const model of Array.isArray(value) ? value : [value]) {
              assert.equal(typeof model.slug, 'string', `${file}: missing model slug`);
              assert.ok(model.slug.length > 0, `${file}: empty model slug`);
              if (!model.slug.startsWith('openrouter/') && !model.slug.startsWith('deepseek/')) continue;
              openrouterEntries += 1;
              const stale = `${file}: rerun scripts/render-openrouter-entries.sh`;
              assert.equal(normalize(model.base_instructions), instructions, stale);
              assert.equal(normalize(model.model_messages.instructions_template), instructions, stale);
              assert.equal(normalize(model.model_messages.persistent_instructions), persistent, stale);
            }
          }
          assert.ok(openrouterEntries > 0);
          NODE
      - name: Check Bash syntax
        if: runner.os != 'Windows'
        run: |
          for file in install.sh scripts/*.sh; do
            bash -n "$file"
          done
      - name: Check Windows PowerShell 5.1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = @('install.ps1') + @(Get-ChildItem scripts, tests -Filter '*.ps1' | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw ($parseErrors | Out-String)
            }
          }
      - name: Test Windows credential permissions
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\private-path.test.ps1
